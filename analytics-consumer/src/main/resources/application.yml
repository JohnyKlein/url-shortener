server:
  port: ${SERVER_PORT:9093}

spring:
  application:
    name: analytics-consumer
  datasource:
    url: jdbc:h2:file:${H2_FILE_PATH:./data/analytics};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 5
          multiplier: 2.0
        default-requeue-rejected: false

app:
  rabbit:
    exchange: shortener.events
    routing-key: shortener.analytics
    queue: shortener.analytics.queue
    dlq: shortener.analytics.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
